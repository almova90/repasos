<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Lecturas bridge</title>
</head>
<body>
<script>
(() => {
  const WEBAPP = 'https://script.google.com/macros/s/AKfycbxrlgBM5eQzONPhsnuYhwe6nehowfiJxbDuTL0EkXyFjD5g4Nw89uuuxovzm0fIoeTyBQ/exec';
  let seq = 0;

  function send(target, payload) {
    try { target.postMessage(Object.assign({source:'lecturas-bridge'}, payload), '*'); } catch (_) {}
  }

  function jsonp(params, timeoutMs) {
    timeoutMs = timeoutMs || 25000;
    return new Promise((resolve, reject) => {
      const cb = '__lecturasGh_' + Date.now() + '_' + (++seq);
      const s = document.createElement('script');
      let done = false;
      const finish = (err, data) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { delete window[cb]; } catch (_) {}
        try { s.remove(); } catch (_) {}
        err ? reject(err) : resolve(data);
      };
      window[cb] = data => finish(null, data);
      const q = new URLSearchParams(Object.assign({}, params, {callback:cb, prefix:cb, _:String(Date.now())}));
      s.src = WEBAPP + '?' + q.toString();
      s.async = true;
      s.onerror = () => finish(new Error('No se ha podido leer Google Sheets.'));
      const timer = setTimeout(() => finish(new Error('Google Sheets ha tardado demasiado en responder.')), timeoutMs);
      document.head.appendChild(s);
    });
  }

  async function post(action, payload) {
    const body = Object.assign({action}, payload || {});
    await fetch(WEBAPP, {
      method: 'POST',
      mode: 'no-cors',
      cache: 'no-store',
      redirect: 'follow',
      headers: {'Content-Type':'text/plain;charset=UTF-8'},
      body: JSON.stringify(body)
    });
    return true;
  }

  window.addEventListener('message', async ev => {
    const m = ev.data;
    if (!m || m.source !== 'lecturas-local' || !m.id || !m.method) return;
    try {
      const a = Array.isArray(m.args) ? m.args : [];
      let result;
      if (m.method === 'getLibraryLight') {
        const r = await jsonp({api:'library'});
        if (!r || r.ok === false) throw new Error((r && r.error) || 'Respuesta inválida.');
        result = r.books || [];
      } else if (m.method === 'getLibraryVersion') {
        const r = await jsonp({api:'version'}, 15000);
        if (!r || r.ok === false) throw new Error((r && r.error) || 'Respuesta inválida.');
        result = r.version || '';
      } else if (m.method === 'getCoverData') {
        const r = await jsonp({api:'cover', id:String(a[0] || '')}, 35000);
        if (!r || r.ok === false) throw new Error((r && r.error) || 'Respuesta inválida.');
        result = r.data || '';
      } else if (m.method === 'saveBook') {
        const book = a[0] || {};
        await post('saveBook', {book});
        result = {id:book.id || '', updatedAt:new Date().toISOString()};
      } else if (m.method === 'deleteBook') {
        await post('deleteBook', {id:String(a[0] || '')});
        result = true;
      } else if (m.method === 'replaceLibrary') {
        await post('replaceLibrary', {books:a[0] || []});
        result = true;
      } else {
        throw new Error('Método remoto no permitido.');
      }
      send(ev.source, {id:m.id, ok:true, result});
    } catch (err) {
      send(ev.source, {id:m.id, ok:false, error:(err && err.message) || String(err || 'Error remoto')});
    }
  });

  send(window.parent, {ready:true});
})();
</script>
</body>
</html>
